<script>
(()=>{'use strict';const data=[{page:'posts',tag:'SHARE YOUR MOMENTS',title:'一些日常碎片。',subtitle:'在这里，记录生活中微小而美好的时刻。',template:'postsTemplate'},{page:'chat',tag:'STAY CONNECTED',title:'聊聊最近。',subtitle:'每一次相遇，都有属于自己的故事。',template:'chatTemplate'},{page:'ai',tag:'A LITTLE MAGIC',title:'小猫 AI ✦',subtitle:'把脑袋里的小问号，慢慢变成灵感。',template:'aiTemplate'},{page:'photos',tag:'THE PHOTO WALL',title:'光影收藏夹。',subtitle:'用照片存起这个世界的温柔。',template:'photosTemplate'},{page:'profile',tag:'MY LITTLE SPACE',title:'关于我。',subtitle:'欢迎来到我的小小角落。',template:'profileTemplate'}];const root=document.documentElement,screen=document.getElementById('phoneScreen'),buttons=[...document.querySelectorAll('.dock-tab')],pill=document.getElementById('glassPill'),viewport=document.getElementById('viewport');let active=0,popTimer;
function select(index,scroll=true){index=Math.max(0,Math.min(data.length-1,index));if(index===active&&document.getElementById('content').children.length)return;active=index;let entry=data[index];buttons.forEach((b,i)=>{b.classList.toggle('active',i===index);if(i===index)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});pill.style.setProperty('--idx',index);pill.classList.remove('is-popping');void pill.offsetWidth;pill.classList.add('is-popping');clearTimeout(popTimer);popTimer=setTimeout(()=>pill.classList.remove('is-popping'),590);document.getElementById('eyebrow').textContent=entry.tag;document.getElementById('pageTitle').textContent=entry.title;document.getElementById('pageSubtitle').textContent=entry.subtitle;document.getElementById('content').replaceChildren(document.getElementById(entry.template).content.cloneNode(true));if(scroll)viewport.scrollTo({top:0,behavior:'instant'})}
buttons.forEach((btn,i)=>btn.addEventListener('click',()=>select(i)));document.getElementById('dockItems').addEventListener('keydown',e=>{if(e.key!=='ArrowRight'&&e.key!=='ArrowLeft')return;e.preventDefault();const next=(active+(e.key==='ArrowRight'?1:-1)+5)%5;select(next);buttons[next].focus()});function setMode(dark){screen.classList.toggle('night',dark);document.getElementById('lightBtn').classList.toggle('on',!dark);document.getElementById('darkBtn').classList.toggle('on',dark)}document.getElementById('lightBtn').addEventListener('click',()=>setMode(false));document.getElementById('darkBtn').addEventListener('click',()=>setMode(true));document.getElementById('mobileThemeButton').addEventListener('click',()=>setMode(!screen.classList.contains('night')));const t=document.getElementById('transparency'),blur=document.getElementById('blur');t.addEventListener('input',()=>{root.style.setProperty('--glass-tint',(+t.value/100).toFixed(2));document.getElementById('transparencyValue').textContent=(100-t.value)+'%'});blur.addEventListener('input',()=>{root.style.setProperty('--glass-blur',blur.value+'px');document.getElementById('blurValue').textContent=blur.value+'px'});select(0,false);})();
</script>
